# Voice of Becky — stackchan-bridge config

# ベッキーむずむずエンジン用 個人 Anthropic API キー
# 会社アカウント（ANTHROPIC_API_KEY 環境変数）とは別に個人キーを使う
# console.anthropic.com → API Keys で発行
becky_api_key: "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"

# Wake words: これらの文字列を含む発話だけ Claude Code に inject する
wake_words:
  - "ベッキー"
  - "ベキたん"
  - "ビッキー"
  - "べっきー"
  - "べきたん"

# マイク設定
audio:
  sample_rate: 16000
  channels: 1
  # sounddevice デバイスインデックス。null = デフォルトデバイス（DJI Mic Mini）
  device_index: null

# VAD 設定（webrtcvad）
vad:
  # 0=最も敏感 / 3=最も厳格（ノイズ耐性高）
  aggressiveness: 2
  # 無音判定: VAD false が何フレーム続いたら発話終了とみなすか
  silence_frames: 25

# Whisper 設定
whisper:
  model_size: "small"
  language: "ja"
  # CPU のみ（M4 は MPS だが ctranslate2 は cpu で安定）
  device: "cpu"
  compute_type: "int8"

# iTerm2 inject 設定
iterm2:
  # inject 前にプロンプトを待つ秒数（Claude Code が入力待ちになるまで）
  wait_before_inject: 0.3

# TTS 設定
tts:
  # VOICEVOX speaker ID（10 = 雨晴はう）。VOICEVOX が落ちてる時は say にフォールバック
  voicevox_speaker_id: 10
  # 話速（1.0 = 標準、1.3 = 速め、0.8 = ゆっくり）
  voicevox_speed: 1.1
  # 音高（0.0 = 標準、+0.1 = 高め、-0.1 = 低め、範囲: -0.15〜0.15）
  voicevox_pitch: -0.03
  # 抑揚の強さ（1.0 = 標準、1.5 = 抑揚強め、0.5 = フラット）
  voicevox_intonation: 1.15
  # 音量（1.0 = 標準）
  voicevox_volume: 1.0
  # 発話前後の無音（秒）
  voicevox_pre_phoneme: 0.18
  voicevox_post_phoneme: 0.18
  # say コマンド用フォールバック設定
  voice: "Kyoko"
  rate: 185
  # 最大読み上げ文字数（長すぎる応答はここで切る）
  max_chars: 300

# stackchan Serial 通信設定 (Phase B)
serial:
  port: "/dev/cu.usbmodem3101"
  baudrate: 115200
  # Serial 監視スレッドを有効にするか（Phase B 実装前は false でスキップ）
  enabled: true

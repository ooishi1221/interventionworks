<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Backstage — Becky</title>
  <meta name="description" content="ベキたんのファン関係ダッシュボード。フォロー/リプ/引用の動きを見る。" />
  <link rel="icon" type="image/png" sizes="32x32" href="/room-favicon-32.png" />
  <link rel="apple-touch-icon" href="/room-apple-touch.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=DotGothic16&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #121214;
      --panel: #1a1a1e;
      --panel2: #202024;
      --line: rgba(255,255,255,0.06);
      --green: #00e676;
      --green-dim: rgba(0,230,118,0.12);
      --green-glow: rgba(0,230,118,0.35);
      --red: #ff5252;
      --red-dim: rgba(255,82,82,0.12);
      --amber: #ffb300;
      --amber-dim: rgba(255,179,0,0.12);
      --blue: #448aff;
      --blue-dim: rgba(68,138,255,0.12);
      --text: #f2f2f5;
      --sub: #8b8b96;
      --sub2: #5c5c66;
      --mono: 'JetBrains Mono', monospace;
      --disp: 'DotGothic16', 'Hiragino Sans', monospace;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', 'Hiragino Sans', sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--green-glow); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2c2c32; border-radius: 4px; }

    /* ── gate（room/studio と共通、localStorage キー共有） ── */
    #passGate { position: fixed; inset: 0; z-index: 9999; background: var(--bg); display: flex; align-items: center; justify-content: center; }
    .gate-box { text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 40px 48px; display: flex; flex-direction: column; align-items: center; gap: 14px; width: 320px; max-width: 90vw; }
    .gate-icon { font-size: 36px; }
    .gate-title { font-family: var(--disp); font-size: 22px; letter-spacing: 0.2em; }
    .gate-sub { font-size: 11px; color: var(--sub2); letter-spacing: 0.14em; font-family: var(--mono); }
    #passInput { width: 100%; padding: 12px 16px; font-size: 16px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; color: var(--text); outline: none; font-family: var(--mono); letter-spacing: 0.2em; text-align: center; }
    #passInput:focus { border-color: var(--green); box-shadow: 0 0 0 2px var(--green-dim); }
    #passBtn { width: 100%; padding: 13px; font-size: 14px; font-weight: 700; background: var(--green); color: #0a0a0c; border: none; border-radius: 12px; cursor: pointer; letter-spacing: 0.06em; }
    #passBtn:hover { filter: brightness(1.12); }
    .gate-error { font-size: 12px; color: var(--red); font-family: var(--mono); height: 16px; }

    /* ── layout ── */
    .wrap { max-width: 1040px; margin: 0 auto; padding: 28px 20px 80px; }
    .topbar { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .topbar h1 { font-family: var(--disp); font-size: 24px; font-weight: 400; letter-spacing: 0.12em; display: flex; align-items: center; gap: 10px; }
    .topbar h1 svg { width: 20px; height: 20px; color: var(--green); }
    .bs-sub { font-size: 11px; color: var(--sub2); letter-spacing: 0.14em; font-family: var(--mono); }
    .back-link { margin-left: auto; font-size: 12px; color: var(--sub); font-family: var(--mono); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; }
    .back-link:hover { color: var(--green); border-color: var(--green); }
    .gen-at { font-size: 11px; color: var(--sub2); font-family: var(--mono); }

    /* ── account selector + tabs ── */
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
    #accountSelect { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-family: var(--mono); font-size: 12.5px; padding: 7px 10px; }
    .tabs { display: flex; gap: 6px; }
    .tab-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--sub); font-size: 12.5px; padding: 7px 14px; cursor: pointer; font-family: 'Inter', 'Hiragino Sans', sans-serif; }
    .tab-btn.active { color: var(--green); border-color: var(--green); background: var(--green-dim); }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; margin-bottom: 16px; }
    .card h2 { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .card h2 svg { width: 15px; height: 15px; color: var(--green); }
    .sub-note { font-size: 11px; color: var(--sub2); margin-bottom: 12px; }
    .empty { color: var(--sub2); font-size: 12px; padding: 12px 0; }
    .view { display: none; }
    .view.active { display: block; }

    /* ── KPI cards ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; position: relative; overflow: hidden; }
    .kpi-card::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--green); opacity: 0.7; }
    .kpi-label { font-size: 11px; color: var(--sub); font-family: var(--mono); display: flex; align-items: center; gap: 6px; }
    .kpi-label svg { width: 13px; height: 13px; }
    .kpi-num { font-size: 30px; font-weight: 800; margin: 4px 0 2px; letter-spacing: -0.02em; }
    .kpi-sub { font-size: 11px; color: var(--sub2); font-family: var(--mono); }
    .kpi-delta { font-size: 11px; font-weight: 700; font-family: var(--mono); }
    .kpi-delta.up { color: var(--green); }
    .kpi-delta.down { color: var(--red); }
    .kpi-delta.flat { color: var(--sub2); }

    /* ── fan table ── */
    .fan-filter { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .fan-filter select { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-family: var(--mono); font-size: 12px; padding: 6px 10px; }
    .fan-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    .fan-tbl th { text-align: left; font-size: 10.5px; color: var(--sub2); font-family: var(--mono); font-weight: 600; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .fan-tbl td { padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.03); }
    .fan-tbl td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
    .cat-chip { font-size: 9.5px; font-weight: 700; padding: 2px 8px; border-radius: 6px; font-family: var(--mono); white-space: nowrap; }
    .cat-chip.コア { color: var(--green); background: var(--green-dim); }
    .cat-chip.常連 { color: var(--blue); background: var(--blue-dim); }
    .cat-chip.初リプ { color: var(--amber); background: var(--amber-dim); }
    .cat-chip.新規 { color: var(--text); background: var(--panel2); }
    .cat-chip.最近来なくなった人 { color: var(--red); background: var(--red-dim); }
    .cat-chip.フォロワー { color: var(--sub); background: var(--panel2); }
    .fb-yes { color: var(--green); }
    .fb-no { color: var(--red); }

    @media (max-width: 640px) {
      .wrap { padding: 18px 12px 60px; }
      .kpi-num { font-size: 24px; }
    }
  </style>
</head>
<body>

<!-- ══ password gate（room/studio と localStorage 共有） ══ -->
<div id="passGate">
  <div class="gate-box">
    <div class="gate-icon">🎭</div>
    <div class="gate-title">BACKSTAGE</div>
    <div class="gate-sub">STAFF PASS REQUIRED — ベキたんファン関係</div>
    <input type="password" id="passInput" placeholder="STAFF PASS" autocomplete="current-password" />
    <button id="passBtn">ENTER</button>
    <div class="gate-error" id="passError"></div>
  </div>
</div>

<div id="appWrap" class="wrap" style="display:none;">
  <div class="topbar">
    <h1><svg data-lucide="heart-handshake"></svg>BACKSTAGE</h1>
    <span class="bs-sub">FAN RELATIONS — ファン関係</span>
    <span class="gen-at" id="genAt"></span>
    <a class="back-link" href="/room">← 作戦本部</a>
  </div>

  <div class="toolbar">
    <select id="accountSelect"></select>
    <div class="tabs">
      <button class="tab-btn active" data-view="dashboard">ダッシュボード</button>
      <button class="tab-btn" data-view="classify">ファン分類</button>
      <button class="tab-btn" data-view="follow">フォロー管理</button>
    </div>
  </div>

  <!-- ダッシュボード -->
  <div class="view active" id="view-dashboard">
    <div class="kpi-grid" id="kpiGrid"></div>
  </div>

  <!-- ファン分類 -->
  <div class="view" id="view-classify">
    <div class="card">
      <h2><svg data-lucide="users"></svg>ファン分類</h2>
      <div class="sub-note">反応の頻度・継続期間からルールベースで分類（コア/常連/初リプ/新規/最近来なくなった人）</div>
      <div class="fan-filter">
        <select id="categoryFilter">
          <option value="">全カテゴリ</option>
          <option value="コア">コア</option>
          <option value="常連">常連</option>
          <option value="初リプ">初リプ</option>
          <option value="新規">新規</option>
          <option value="最近来なくなった人">最近来なくなった人</option>
          <option value="フォロワー">フォロワー</option>
        </select>
      </div>
      <div style="overflow-x:auto"><table class="fan-tbl" id="classifyTbl"></table></div>
    </div>
  </div>

  <!-- フォロー管理 -->
  <div class="view" id="view-follow">
    <div class="card">
      <h2><svg data-lucide="user-x"></svg>フォロー管理</h2>
      <div class="sub-note">フォローバックしてない人一覧（同じデータの別フィルタ）</div>
      <div style="overflow-x:auto"><table class="fan-tbl" id="followTbl"></table></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
const ROOM_PASS = 'bk2026';
const PASS_KEY = 'room_auth_v1';   // room/studio と共有 — 解錠済みなら自動入場

const ACCOUNTS = [
  { id: 'becky_exists', label: '@becky_exists' },
];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtAgo = (iso) => {
  if (!iso) return '--';
  const d = new Date(iso);
  if (isNaN(d)) return '--';
  const m = Math.floor((Date.now() - d.getTime()) / 60000);
  if (m < 1) return 'now';
  if (m < 60) return `${m}m前`;
  if (m < 1440) return `${Math.floor(m / 60)}h前`;
  return `${Math.floor(m / 1440)}d前`;
};
async function fetchJson(path) {
  try {
    const r = await fetch(path + '?t=' + Date.now());
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch { return null; }
}

let currentRoster = null;

function buildKpi(data) {
  const w = data?.weekly || {};
  const delta = (now, prev) => {
    if (now == null || prev == null) return '';
    const d = now - prev;
    const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
    return `<span class="kpi-delta ${cls}">${d >= 0 ? '+' : ''}${d} /週</span>`;
  };
  $('kpiGrid').innerHTML = `
    <div class="kpi-card"><div class="kpi-label"><svg data-lucide="user-plus"></svg>新規フォロワー</div>
      <div class="kpi-num">${w.new_followers_7d ?? '--'}</div><div class="kpi-sub">先週 ${w.new_followers_prev7d ?? '--'} ${delta(w.new_followers_7d, w.new_followers_prev7d)}</div></div>
    <div class="kpi-card"><div class="kpi-label"><svg data-lucide="message-circle"></svg>リプライ</div>
      <div class="kpi-num">${w.replies_7d ?? '--'}</div><div class="kpi-sub">先週 ${w.replies_prev7d ?? '--'} ${delta(w.replies_7d, w.replies_prev7d)}</div></div>
    <div class="kpi-card"><div class="kpi-label"><svg data-lucide="quote"></svg>引用RT</div>
      <div class="kpi-num">${w.quotes_7d ?? '--'}</div><div class="kpi-sub">先週 ${w.quotes_prev7d ?? '--'} ${delta(w.quotes_7d, w.quotes_prev7d)}</div></div>`;
}

function fanRow(f) {
  return `<tr>
    <td><span class="cat-chip ${esc(f.category)}">${esc(f.category)}</span></td>
    <td><a href="https://x.com/${esc(f.screen_name)}" target="_blank" rel="noopener">@${esc(f.screen_name)}</a></td>
    <td class="num">${f.reply_count}</td>
    <td class="num">${f.quote_count}</td>
    <td class="num">${f.tenure_days ?? '--'}日</td>
    <td class="num">${fmtAgo(f.last_reaction)}</td>
    <td class="num ${f.is_following_back ? 'fb-yes' : 'fb-no'}">${f.is_following_back ? 'Yes' : 'No'}</td>
  </tr>`;
}

const FAN_TBL_HEAD = `<thead><tr><th>分類</th><th>アカウント</th><th style="text-align:right">返信</th><th style="text-align:right">引用</th><th style="text-align:right">継続</th><th style="text-align:right">最終反応</th><th style="text-align:right">FB</th></tr></thead>`;

function buildClassifyTbl() {
  if (!currentRoster) return;
  const filter = $('categoryFilter').value;
  const fans = currentRoster.fans.filter(f => !filter || f.category === filter);
  $('classifyTbl').innerHTML = fans.length
    ? FAN_TBL_HEAD + `<tbody>${fans.map(fanRow).join('')}</tbody>`
    : '<tr><td class="empty">該当なし</td></tr>';
}

function buildFollowTbl() {
  if (!currentRoster) return;
  const fans = currentRoster.fans.filter(f => !f.is_following_back);
  $('followTbl').innerHTML = fans.length
    ? FAN_TBL_HEAD + `<tbody>${fans.map(fanRow).join('')}</tbody>`
    : '<tr><td class="empty">フォローバックしてない人はいません</td></tr>';
}

async function loadAccount(accountId) {
  const data = await fetchJson(`/fan_roster_${accountId}.json`);
  currentRoster = data;
  if (data?.generated_at) $('genAt').textContent = `生成: ${fmtAgo(data.generated_at)}`;
  buildKpi(data || {});
  buildClassifyTbl();
  buildFollowTbl();
  if (window.lucide) lucide.createIcons();
}

function initTabs() {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      $(`view-${btn.dataset.view}`).classList.add('active');
    });
  });
}

function initAccountSelect() {
  $('accountSelect').innerHTML = ACCOUNTS.map(a => `<option value="${a.id}">${esc(a.label)}</option>`).join('');
  $('accountSelect').addEventListener('change', (e) => loadAccount(e.target.value));
}

$('categoryFilter')?.addEventListener?.('change', buildClassifyTbl);

(function initGate() {
  const gate = $('passGate');
  const app = $('appWrap');
  const authed = () => localStorage.getItem(PASS_KEY) === ROOM_PASS;
  function enter() {
    gate.style.display = 'none';
    app.style.display = 'block';
    initTabs();
    initAccountSelect();
    $('categoryFilter').addEventListener('change', buildClassifyTbl);
    loadAccount(ACCOUNTS[0].id);
    setInterval(() => loadAccount($('accountSelect').value), 300000);
  }
  if (authed()) { enter(); return; }
  gate.style.display = 'flex';
  const input = $('passInput'), btn = $('passBtn'), err = $('passError');
  function tryAuth() {
    if (input.value === ROOM_PASS) {
      localStorage.setItem(PASS_KEY, ROOM_PASS);
      enter();
    } else {
      err.textContent = '— 認証失敗 —';
      input.value = '';
      input.focus();
      setTimeout(() => { err.textContent = ''; }, 2000);
    }
  }
  btn.addEventListener('click', tryAuth);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryAuth(); });
  input.focus();
})();
</script>
</body>
</html>
